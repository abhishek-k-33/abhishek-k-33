<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="OsdagBridge — bridge analysis &amp; design · IRC codes · OpenSees">
<style>
  .float{animation:float 6s ease-in-out infinite;transform-box:fill-box}
  .float2{animation:float 7.5s ease-in-out -2s infinite;transform-box:fill-box}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .drift{animation:drift 14s ease-in-out infinite;transform-box:fill-box}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,18px)}}
  .grow{animation:grow 4s ease-in-out infinite;transform-origin:left;transform-box:fill-box}
  .grow.d1{animation-delay:-1s}.grow.d2{animation-delay:-2s}.grow.d3{animation-delay:-3s}
  @keyframes grow{0%,100%{transform:scaleX(.35)}50%{transform:scaleX(1)}}
  .caret{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .cursor{animation:cursor 8s ease-in-out infinite}
  @keyframes cursor{0%,100%{transform:translate(0,0)}25%{transform:translate(-150px,-40px)}
    50%{transform:translate(-60px,50px)}75%{transform:translate(70px,-10px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}

  .draw{stroke-dasharray:900;animation:draw 6s ease-in-out infinite}
  @keyframes draw{0%{stroke-dashoffset:900}45%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-900}}
  .scan{animation:scan 3.5s ease-in-out infinite}
  @keyframes scan{0%,100%{transform:translateY(0)}50%{transform:translateY(118px)}}
  .bob{animation:bob 2.4s ease-in-out infinite}
  @media (prefers-reduced-motion:reduce){.draw{stroke-dasharray:none}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
</style>
